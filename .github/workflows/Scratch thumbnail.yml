name: Grab Scratch thumbnail

on:
  workflow_dispatch:
    inputs:
      project:
        description: Scratch project ID or URL
        required: true
      commit:
        description: Commit the thumbnail into the repo
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  thumbnail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: thumb
        uses: ./.github/actions/scratch-thumbnail
        with:
          project: ${{ inputs.project }}
          # output: images/{id}.png   # optional, default is thumbnails/{id}.png
          # width: "480"
          # height: "360"

      - uses: actions/upload-artifact@v4
        with:
          name: scratch-thumbnail-${{ steps.thumb.outputs.project-id }}
          path: ${{ steps.thumb.outputs.path }}
          if-no-files-found: error

      - name: Commit thumbnail
        if: inputs.commit
        env:
          THUMB: ${{ steps.thumb.outputs.path }}
          PROJECT_ID: ${{ steps.thumb.outputs.project-id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$THUMB"
          if git diff --cached --quiet; then
            echo "Thumbnail unchanged, nothing to commit."
          else
            git commit -m "Update Scratch thumbnail for project $PROJECT_ID"
            git push
          fi
