name: Grab Scratch thumbnail

on:
  schedule:
    - cron: "*/15 * * * *"   # check every 15 minutes
  workflow_dispatch:
    inputs:
      project:
        description: Scratch project ID or URL (leave blank for the watched project)
        required: false
      commit:
        description: Commit the thumbnail into the repo
        type: boolean
        default: true

env:
  WATCHED_PROJECT: "1381537995"

permissions:
  contents: write

concurrency:
  group: scratch-thumbnail
  cancel-in-progress: false

jobs:
  thumbnail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: thumb
        uses: ./.github/actions/scratch-thumbnail
        with:
          project: ${{ inputs.project || env.WATCHED_PROJECT }}

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: scratch-thumbnail-${{ steps.thumb.outputs.project-id }}
          path: ${{ steps.thumb.outputs.path }}
          if-no-files-found: error

      - name: Put thumbnail in README
        if: github.event_name == 'schedule' || inputs.commit
        env:
          THUMB: ${{ steps.thumb.outputs.path }}
          PROJECT_ID: ${{ steps.thumb.outputs.project-id }}
        shell: python
        run: |
          import hashlib, os, re, pathlib

          thumb = os.environ["THUMB"]
          pid = os.environ["PROJECT_ID"]
          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8") if readme.exists() else ""

          # Short hash of the image so the README (and any caches) change when the image does.
          v = hashlib.sha256(pathlib.Path(thumb).read_bytes()).hexdigest()[:8]
          start = f"<!-- scratch-thumbnail:{pid}:start -->"
          end = f"<!-- scratch-thumbnail:{pid}:end -->"
          block = (
              f"{start}\n"
              f'<p align="center">\n'
              f'  <a href="https://scratch.mit.edu/projects/{pid}/">'
              f'<img src="{thumb}?v={v}" alt="Scratch project {pid}" width="480"></a>\n'
              f'</p>\n'
              f"{end}"
          )

          pattern = re.compile(re.escape(start) + r".*?" + re.escape(end), re.S)
          if pattern.search(text):
              text = pattern.sub(lambda m: block, text)
          else:
              text = text.rstrip("\n") + ("\n\n" if text.strip() else "") + block + "\n"

          readme.write_text(text, encoding="utf-8")
          print(block)

      - name: Commit if anything changed
        if: github.event_name == 'schedule' || inputs.commit
        env:
          THUMB: ${{ steps.thumb.outputs.path }}
          PROJECT_ID: ${{ steps.thumb.outputs.project-id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$THUMB" README.md
          if git diff --cached --quiet; then
            echo "Thumbnail and README unchanged, nothing to commit."
          else
            git commit -m "Update Scratch thumbnail for project $PROJECT_ID"
            git pull --rebase --autostash
            git push
          fi
