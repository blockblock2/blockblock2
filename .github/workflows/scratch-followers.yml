name: Follower counts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the changes"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: readme-followers
  cancel-in-progress: false

env:
  SCRATCH_USER: blockblock2
  GITHUB_USER: blockblock2
  SHOW_GITHUB: "false"   # change to "true" to bring back the GitHub followers badge
  MILESTONE_EVERY: "10"  # show your 10th, 20th, 30th... follower
  BADGE_HEIGHT: "48"     # normal badge size is 28; bigger number = bigger badge

jobs:
  followers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Always start from the newest main, even on "Re-run jobs".
          ref: ${{ github.event.repository.default_branch }}

      - name: Update README and Follower.md
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT: ${{ github.event_name == 'schedule' || inputs.commit }}
        run: |
          import json, os, pathlib, re, subprocess, time, urllib.request

          scratch_user = os.environ["SCRATCH_USER"]
          github_user = os.environ["GITHUB_USER"]
          every = int(os.environ.get("MILESTONE_EVERY", "10"))
          badge_height = int(os.environ.get("BADGE_HEIGHT", "48"))
          UA = {"User-Agent": "Mozilla/5.0 (github-actions follower-counts)"}

          def get(url, headers=None, tries=3):
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={**UA, **(headers or {})})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return r.read().decode("utf-8", "replace")
                  except Exception as e:
                      print(f"  {url} failed ({e}), try {i + 1}/{tries}")
                      time.sleep(5 * (i + 1))
              return None

          # ================= Get the data (once) =================

          def scratch_page_count():
              # The followers page heading says "Followers (N)".
              html = get(f"https://scratch.mit.edu/users/{scratch_user}/followers/")
              m = html and re.search(r"Followers\s*\(([\d,]+)\)", html)
              return int(m.group(1).replace(",", "")) if m else None

          def scratch_list_from_pages(expected):
              # Read the same followers pages you see on Scratch (newest first, 60 per page).
              people, page_no = [], 1
              while True:
                  html = get(f"https://scratch.mit.edu/users/{scratch_user}/followers/?page={page_no}",
                             tries=3 if page_no == 1 else 2)
                  if not html:
                      break
                  found = 0
                  for item in re.findall(r'<li[^>]*class="[^"]*\buser\b[^"]*\bthumb\b[^"]*"[^>]*>(.*?)</li>', html, re.S):
                      name = re.search(r'href="/users/([\w-]+)/"', item)
                      if not name or any(x["name"] == name.group(1) for x in people):
                          continue
                      img = re.search(r'(?:data-original|src)="((?:https?:)?//[^"]+)"', item)
                      src = img.group(1) if img else ""
                      if src.startswith("//"):
                          src = "https:" + src
                      people.append({"name": name.group(1), "img": src or f"https://cdn2.scratch.mit.edu/get_image/user/0_60x60.png"})
                      found += 1
                  if found == 0 or (expected and len(people) >= expected):
                      break
                  page_no += 1
              return people or None

          def scratch_follower_list():
              # Every follower from Scratch's API, newest first, 40 per page.
              people, offset = [], 0
              while True:
                  body = get(f"https://api.scratch.mit.edu/users/{scratch_user}/followers?limit=40&offset={offset}")
                  if body is None:
                      return None
                  page = json.loads(body)
                  for p in page:
                      if any(x["name"] == p["username"] for x in people):
                          print(f"  {p['username']} showed up twice in Scratch's list, skipping the repeat")
                          continue
                      imgs = (p.get("profile") or {}).get("images") or {}
                      people.append({
                          "name": p["username"],
                          "img": imgs.get("60x60") or f"https://cdn2.scratch.mit.edu/get_image/user/{p['id']}_60x60.png",
                      })
                  if len(page) < 40:
                      return people
                  offset += 40

          def github_count():
              body = get(
                  f"https://api.github.com/users/{github_user}",
                  {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
              )
              try:
                  return int(json.loads(body)["followers"]) if body else None
              except Exception as e:
                  print(f"Couldn't read GitHub followers: {e}")
                  return None

          scratch = scratch_page_count()
          followers = scratch_list_from_pages(scratch)
          if followers is not None:
              print(f"Followers page says {scratch}, read {len(followers)} names from the followers pages")
          else:
              print("::warning::Couldn't read names from the followers pages, trying Scratch's API instead.")
              followers = scratch_follower_list()
              if followers is not None:
                  print(f"Followers page says {scratch}, Scratch's API list has {len(followers)} people")
          if followers is None:
              print("::warning::Couldn't get the Scratch follower list, leaving the names alone.")
          elif scratch is None:
              scratch = len(followers)
          if followers:
              print("Newest 3: " + ", ".join(p["name"] for p in followers[:3]))
          counts = {"Scratch": scratch}
          if os.environ.get("SHOW_GITHUB", "").lower() == "true":
              counts["GitHub"] = github_count()

          badge_sizes = {}
          def size_attrs(url):
              # GitHub ignores height on its own, so work out the matching width too.
              if url not in badge_sizes:
                  svg = get(url)
                  m = svg and re.search(r'<svg[^>]*?\swidth="([\d.]+)"[^>]*?\sheight="([\d.]+)"', svg)
                  if m:
                      w, h = float(m.group(1)), float(m.group(2))
                      badge_sizes[url] = f'width="{round(w * badge_height / h)}" height="{badge_height}"'
                  else:
                      print(f"  Couldn't read badge size from {url}, using height only")
                      badge_sizes[url] = f'height="{badge_height}"'
              return badge_sizes[url]

          # ================= Build the files =================

          def markers(kind):
              start = f"<!-- {kind}:{scratch_user}:start -->"
              end = f"<!-- {kind}:{scratch_user}:end -->"
              return start, end, re.compile(re.escape(start) + r".*?" + re.escape(end), re.S)

          def put_block(text, kind, inner, after_kind=None):
              start, end, pattern = markers(kind)
              block = f"{start}\n{inner}\n{end}"
              if pattern.search(text):
                  return pattern.sub(lambda m: block, text)
              if after_kind:
                  a = markers(after_kind)[2].search(text)
                  if a:
                      return text[:a.end()] + "\n\n" + block + text[a.end():]
              return text.rstrip("\n") + ("\n\n" if text.strip() else "") + block + "\n"

          def ordinal(n):
              suffix = "th" if 10 <= n % 100 <= 20 else {1: "st", 2: "nd", 3: "rd"}.get(n % 10, "th")
              return f"{n:,}{suffix}"

          def grid(people, per_row):
              rows = []
              for i in range(0, len(people), per_row):
                  cells = "".join(
                      f'<td align="center"><b>{ordinal(p["n"])}</b><br>'
                      f'<a href="https://scratch.mit.edu/users/{p["name"]}/">'
                      f'<img src="{p["img"]}" width="60" height="60" alt="{p["name"]}"><br><sub>{p["name"]}</sub></a></td>'
                      for p in people[i:i + per_row]
                  )
                  rows.append(f"  <tr>{cells}</tr>")
              return "<table>\n" + "\n".join(rows) + "\n</table>"

          def build():
              readme = pathlib.Path("README.md")
              text = readme.read_text(encoding="utf-8") if readme.exists() else ""

              # --- Badges ---
              badge_block = markers("scratch-followers")[2].search(text)
              def previous(site):
                  # If a site is down, keep the number that's already in the README.
                  m = badge_block and re.search(r'alt="([\d,]+) ' + site + r' follower', badge_block.group(0))
                  return int(m.group(1).replace(",", "")) if m else None
              shown = {}
              for site, n in counts.items():
                  if n is None:
                      n = previous(site)
                      print(f"::warning::Couldn't get {site} followers, keeping the old number ({n}).")
                  if n is not None:
                      shown[site] = n
              styles = {
                  "Scratch": (f"https://scratch.mit.edu/users/{scratch_user}/followers/", "F9A825", "scratch"),
                  "GitHub": (f"https://github.com/{github_user}?tab=followers", "181717", "github"),
              }
              badges = []
              for site, n in shown.items():
                  link, color, logo = styles[site]
                  label = "follower" if n == 1 else "followers"
                  src = f"https://img.shields.io/badge/{site}-{n:,}%20{label}-{color}?style=for-the-badge&logo={logo}&logoColor=white"
                  badges.append(f'  <a href="{link}"><img src="{src}" {size_attrs(src)} alt="{n:,} {site} {label}"></a>')
              if badges:
                  text = put_block(text, "scratch-followers", '<p align="center">\n' + "\n  &nbsp;\n".join(badges) + "\n</p>")

              # --- Milestone followers (10th, 20th, ...) in the README and Follower.md ---
              # Remove the old "Newest followers" section from the earlier version.
              text = markers("scratch-newest-followers")[2].sub("", text)
              text = re.sub(r"\n{3,}", "\n\n", text)
              if followers:
                  oldest_first = list(reversed(followers))
                  milestones = [
                      {**oldest_first[k - 1], "n": k}
                      # Never go past the real count from the followers page.
                      for k in range(every, min(len(oldest_first), shown.get("Scratch", len(oldest_first))) + 1, every)
                  ]
                  if milestones:
                      table = '<div align="center">\n\n' + grid(milestones, 5) + "\n\n</div>"
                      text = put_block(
                          text, "scratch-follower-milestones",
                          '<p align="center"><b>🏆 Follower milestones</b></p>\n' + table,
                          after_kind="scratch-followers",
                      )
                      pathlib.Path("Follower.md").write_text(
                          f"<!-- This file is rewritten automatically by the Follower counts workflow. -->\n"
                          f'<h1 align="center">🏆 {scratch_user}\'s follower milestones</h1>\n\n'
                          f'<p align="center">Every {every}th follower on Scratch, out of {len(followers):,} so far · '
                          f'<a href="README.md">← Back to profile</a></p>\n\n' + table + "\n",
                          encoding="utf-8",
                      )
                  else:
                      text = markers("scratch-follower-milestones")[2].sub("", text)
                      text = re.sub(r"\n{3,}", "\n\n", text)

              readme.write_text(text, encoding="utf-8")
              return ", ".join(f"{s} {n}" for s, n in shown.items())

          # ================= Save and push =================

          def git(*args, check=True):
              return subprocess.run(["git", *args], check=check)

          if os.environ.get("COMMIT", "").lower() != "true":
              build()
              print("Not committing (turned off for this run).")
              raise SystemExit(0)

          if all(n is None for n in counts.values()) and followers is None:
              raise SystemExit("::error::Couldn't reach Scratch at all, leaving everything alone.")

          git("config", "user.name", "github-actions[bot]")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          branch = os.environ["BRANCH"]
          for attempt in range(1, 6):
              # Start from whatever is on GitHub right now, so there's nothing to merge.
              git("fetch", "origin", branch)
              git("reset", "--hard", f"origin/{branch}")
              summary = build()
              git("add", "README.md")
              if pathlib.Path("Follower.md").exists():
                  git("add", "Follower.md")
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
                  print("Nothing changed, nothing to commit.")
                  break
              git("commit", "-m", f"Update followers ({summary})")
              if git("push", "origin", f"HEAD:{branch}", check=False).returncode == 0:
                  print("Pushed.")
                  break
              print(f"Push didn't go through (something else changed the repo), redoing it. Try {attempt}/5")
              time.sleep(3 * attempt)
          else:
              raise SystemExit("::error::Couldn't push after 5 tries.")
