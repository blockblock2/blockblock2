name: Scratch project thumbnail
description: Download the thumbnail of a Scratch project, with retries and multiple fallback sources.
branding:
  icon: image
  color: orange

inputs:
  project:
    description: Scratch project ID or URL (e.g. 10128407 or https://scratch.mit.edu/projects/10128407/)
    required: true
  output:
    description: Where to save the image. "{id}" is replaced with the project ID.
    required: false
    default: thumbnails/{id}.png
  width:
    description: Thumbnail width in pixels
    required: false
    default: "480"
  height:
    description: Thumbnail height in pixels
    required: false
    default: "360"
  attempts:
    description: How many full passes over all sources before giving up
    required: false
    default: "4"

outputs:
  path:
    description: Path of the saved thumbnail
    value: ${{ steps.fetch.outputs.path }}
  url:
    description: The URL the thumbnail was actually downloaded from
    value: ${{ steps.fetch.outputs.url }}
  mime-type:
    description: Detected MIME type of the saved file
    value: ${{ steps.fetch.outputs.mime-type }}
  project-id:
    description: The numeric project ID that was resolved from the input
    value: ${{ steps.fetch.outputs.project-id }}

runs:
  using: composite
  steps:
    - id: fetch
      shell: bash
      env:
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_WIDTH: ${{ inputs.width }}
        INPUT_HEIGHT: ${{ inputs.height }}
        INPUT_ATTEMPTS: ${{ inputs.attempts }}
      run: bash "$GITHUB_ACTION_PATH/fetch-thumbnail.sh"
